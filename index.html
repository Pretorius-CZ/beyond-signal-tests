<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beyond the Signal · boti</title>
<style>
:root{--bg:#eef2f5;--panel:#fff;--ink:#14212e;--muted:#5a6b7c;--line:#d5dee6;--accent:#b8761f}
@media (prefers-color-scheme:dark){:root{--bg:#0b1420;--panel:#122030;--ink:#e3ebf2;--muted:#8fa3b6;--line:#21364a;--accent:#e2a75a;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:48px 16px;display:grid;gap:16px}
h1{margin:0;font-size:28px}p{color:var(--muted);margin:0}
a.card{display:block;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;color:inherit;text-decoration:none}
a.card:hover{border-color:var(--accent)}a.card b{display:block;font-size:18px}
</style>
</head>
<body>
<main>
  <h1>Beyond the Signal · herní boti</h1>
  <p>Výsledky automatických průchodů hrou.</p>
  <a class="card" href="denni/"><b>Denní kontrola</b>Prvních 6 levelů na 8–9 zařízeních v EN a CS, každé ráno.</a>
  <a class="card" href="cela-hra/"><b>Celá hra</b>Všech 167 levelů na vybraných zařízeních, každou neděli.</a>
</main>
</body>
</html>

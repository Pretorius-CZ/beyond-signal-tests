name: Herní boti – celá hra

# Každou noc projde bot všech 167 levelů na každém zařízení a v každém jazyce.
# Každá kombinace běží souběžně ve vlastní úloze (2,5–4 hodiny), ráno je hotový report.

on:
  workflow_dispatch:
    inputs:
      devices:
        description: 'Zařízení (oddělená čárkou)'
        default: 'iPhone SE (malý telefon),iPhone 15 Pro Max,Pixel 7 (Android),Galaxy S9+ (Android),Telefon na šířku,iPad Mini,Notebook 1366×768,Desktop 1920×1080,Desktop Firefox'
      langs:
        description: 'Jazyky (en,cs)'
        default: 'en,cs'
      retries:
        description: 'Kolikrát smí bot prohraný level zkusit znovu'
        default: '3'
      base_url:
        description: 'Adresa hry (prázdné = živý web s UTM štítkem botů)'
        default: ''
  schedule:
    - cron: '7 21 * * *'      # každý den ve 23:07 českého času (letní čas), hotovo do rána

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: game-tests-full
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      devices: ${{ steps.m.outputs.devices }}
      langs: ${{ steps.m.outputs.langs }}
    steps:
      - id: m
        env:
          DEVICES: ${{ inputs.devices || 'iPhone SE (malý telefon),iPhone 15 Pro Max,Pixel 7 (Android),Galaxy S9+ (Android),Telefon na šířku,iPad Mini,Notebook 1366×768,Desktop 1920×1080,Desktop Firefox' }}
          LANGS: ${{ inputs.langs || 'en,cs' }}
        run: |
          echo "devices=$(node -e 'console.log(JSON.stringify(process.env.DEVICES.split(",").map(s=>s.trim()).filter(Boolean)))')" >> "$GITHUB_OUTPUT"
          echo "langs=$(node -e 'console.log(JSON.stringify(process.env.LANGS.split(",").map(s=>s.trim()).filter(Boolean)))')" >> "$GITHUB_OUTPUT"

  play:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 350        # GitHub povolí max. 6 hodin na úlohu
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(needs.plan.outputs.devices) }}
        lang: ${{ fromJSON(needs.plan.outputs.langs) }}
    env:
      BASE_URL: ${{ inputs.base_url }}
      LEVELS: all
      EXPECTED_LEVELS: '187'    # počet levelů ve hře; po jejich dohrání je konec hry, ne zaseknutí
      LANGS: ${{ matrix.lang }}
      RETRIES: ${{ inputs.retries || '3' }}
      SHOTS: key                # screenshot desky u každého levelu + chyby, bez obrazovek výher
      FULL_BROWSERS: '1'
      WORKERS: '1'
      BOT_SEED: ${{ secrets.BOT_SEED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      - name: Bot prochází celou hru
        run: npx playwright test --project "${{ matrix.device }}"
        continue-on-error: true
      - id: name
        run: echo "slug=$(echo '${{ matrix.device }}-${{ matrix.lang }}' | iconv -t ascii//TRANSLIT | tr -cs 'A-Za-z0-9' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-${{ steps.name.outputs.slug }}
          path: |
            reports/data
            reports/shots
          retention-days: 30

  report:
    needs: play
    if: always()
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: full-*
          path: reports
          merge-multiple: true
      - name: Souhrn
        run: |
          node scripts/summary.mjs > /dev/null
          cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Webový report (jen výběr screenshotů, zmenšených)
        run: |
          SHOTS_SAMPLE=1 SHOTS_DIR=thumbs OUT=reports/web.html node scripts/summary.mjs > /dev/null
          command -v convert >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)
          mkdir -p web/cela-hra/thumbs
          cp site/index.html web/index.html
          cp reports/web.html web/cela-hra/index.html
          grep -o 'thumbs/[^"]*\.jpg' reports/web.html | sort -u | while read -r t; do
            n="${t#thumbs/}"; src="reports/shots/$(echo "${n%.jpg}" | sed 's#__#/#').png"
            if [ -f "$src" ]; then convert "$src" -resize "900x900>" -quality 72 "web/cela-hra/$t"; fi
          done
          du -sh web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4

name: Herní boti – celá hra

# Bot projde všechny levely od začátku do konce. Trvá 2–4 hodiny na zařízení,
# proto běží jednou týdně a jen na vybraných zařízeních (každé ve vlastní úloze souběžně).

on:
  workflow_dispatch:
    inputs:
      devices:
        description: 'Zařízení (názvy z playwright.config.js, oddělené čárkou)'
        default: 'iPhone SE (malý telefon),Pixel 7 (Android),Notebook 1366×768'
      langs:
        description: 'Jazyky (en,cs)'
        default: 'en'
      retries:
        description: 'Kolikrát smí bot prohraný level zkusit znovu'
        default: '3'
      base_url:
        description: 'Adresa hry (prázdné = živý web s UTM štítkem botů)'
        default: ''
  schedule:
    - cron: '7 1 * * 0'       # neděle cca 3:07 českého času

permissions:
  contents: write

concurrency:
  group: game-tests-full
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      devices: ${{ steps.m.outputs.devices }}
    steps:
      - id: m
        env:
          DEVICES: ${{ inputs.devices || 'iPhone SE (malý telefon),Pixel 7 (Android),Notebook 1366×768' }}
        run: echo "devices=$(node -e 'console.log(JSON.stringify(process.env.DEVICES.split(",").map(s=>s.trim()).filter(Boolean)))')" >> "$GITHUB_OUTPUT"

  play:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350        # GitHub povolí max. 6 hodin na úlohu
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(needs.plan.outputs.devices) }}
    env:
      BASE_URL: ${{ inputs.base_url }}
      LEVELS: all
      EXPECTED_LEVELS: '167'    # počet levelů ve hře; po jejich dohrání je konec hry, ne zaseknutí
      LANGS: ${{ inputs.langs || 'en' }}
      RETRIES: ${{ inputs.retries || '3' }}
      SHOTS: key                # screenshot desky u každého levelu + chyby, bez obrazovek výher
      FULL_BROWSERS: '1'
      WORKERS: '2'
      BOT_SEED: ${{ secrets.BOT_SEED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      - name: Bot prochází celou hru
        run: npx playwright test --project "${{ matrix.device }}"
        continue-on-error: true
      - id: name
        run: echo "slug=$(echo '${{ matrix.device }}' | iconv -t ascii//TRANSLIT | tr -cs 'A-Za-z0-9' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-${{ steps.name.outputs.slug }}
          path: |
            reports/data
            reports/shots
          retention-days: 30

  report:
    needs: play
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: full-*
          path: reports
          merge-multiple: true
      - name: Souhrn
        run: |
          node scripts/summary.mjs > /dev/null
          cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Zveřejnit report (…/cela-hra/)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: reports
          destination_dir: cela-hra
          keep_files: true
